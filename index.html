<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#080b0d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="影ノ城">
  <meta name="format-detection" content="telephone=no">
  <meta property="og:title" content="影ノ城・忍殺行">
  <meta property="og:description" content="眠る殿の首を掻くため、五層の城を影で駆け上がる忍者アクション">
  <meta property="og:url" content="https://titan11111.github.io/033-nekubi/">
  <meta property="og:type" content="website">
  <title>影ノ城・忍殺行</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="game-shell">
    <section id="game-view" aria-label="アクション画面">
      <div id="title-screen" class="screen-layer">
        <div class="title-art" aria-hidden="true">
          <div class="moon"></div>
          <div class="keep"></div>
          <span class="ninja-mark">忍</span>
        </div>
        <div class="title-copy">
          <span class="seal">密</span>
          <p class="overline">SHADOW ASSASSIN</p>
          <h1>影ノ城</h1>
          <p class="title-sub">闇夜に黄色い月。雲が面を隠す間に忍び、<br>眠る殿の首を掻け。</p>
          <button id="startBtn" class="primary-button game-btn" type="button">忍務開始</button>
          <div class="title-meta">
            <span>最高戦果 <b id="highScoreText">000000</b></span>
            <button id="techBtn" class="game-btn" type="button">実装技術</button>
          </div>
        </div>
      </div>

      <canvas id="gameCanvas" width="1280" height="720" aria-label="ゲーム画面"></canvas>

      <div id="hud">
        <div class="hud-block stage-block">
          <span class="eyebrow">階層</span>
          <strong id="stageNumber">第一層</strong>
          <span id="stageName">荒野と城の入口</span>
        </div>
        <div class="hud-block meters">
          <div class="meter-row">
            <span>命</span>
            <i id="healthMeter"><b></b></i>
            <em id="healthText">4</em>
          </div>
          <div class="meter-row shadow">
            <span>影</span>
            <i id="shadowMeter"><b></b></i>
            <em id="shadowText">100</em>
          </div>
        </div>
        <div class="hud-block mission-block">
          <span class="eyebrow">任務</span>
          <strong id="objectiveText">密書を奪還せよ</strong>
          <span id="objectiveCount">0 / 2　手裏剣 7</span>
        </div>
        <button id="muteBtn" class="utility-button game-btn" type="button" aria-label="音を消す">音</button>
        <button id="fullscreenBtn" class="utility-button game-btn" type="button" aria-label="全画面">全</button>
      </div>

      <nav id="stage-route" aria-label="階層">
        <div class="route-node current"><b>1</b><small>荒野</small></div><i></i>
        <div class="route-node"><b>2</b><small>兵舎</small></div><i></i>
        <div class="route-node"><b>3</b><small>石垣</small></div><i></i>
        <div class="route-node"><b>4</b><small>御殿</small></div><i></i>
        <div class="route-node"><b>5</b><small>天守</small></div>
      </nav>

      <div id="notice" role="status" aria-live="polite">
        <strong id="noticeKicker">任務</strong>
        <span id="noticeText">敵に気づかれる前に、影の中へ隠れてください。</span>
      </div>

      <div id="alert-vane">
        <span>警戒</span>
        <i><b id="alertFill"></b></i>
        <em id="alertText">平静</em>
      </div>

      <button id="pauseBtn" class="pause-button game-btn" type="button" aria-label="一時停止">止</button>

      <div id="pause-layer" class="hidden">
        <strong>静止</strong>
        <span>画面を触れて再開</span>
      </div>

      <div id="result-screen" class="screen-layer hidden">
        <div class="result-card">
          <p class="overline" id="resultKicker">LAYER COMPLETE</p>
          <h2 id="resultTitle">突破</h2>
          <p id="resultBody">次の階層へ進め。</p>
          <div class="result-stats">
            <span>戦果 <b id="resultScore">000000</b></span>
            <span>連撃 <b id="resultCombo">0</b></span>
          </div>
          <button id="nextBtn" class="primary-button game-btn" type="button">次の階層へ</button>
        </div>
      </div>

      <aside id="tech-panel" aria-hidden="true">
        <div class="tech-head">
          <div>
            <span>WEB TECH</span>
            <h2>実装した技術</h2>
          </div>
          <button id="techClose" class="game-btn" type="button" aria-label="閉じる">×</button>
        </div>
        <ol id="techList"></ol>
      </aside>
    </section>

    <section id="controls" aria-label="操作盤">
      <div class="dpad" id="dpad" aria-label="丸十字キー。斜め入力できます">
        <span class="dpad-bar dpad-bar-x" aria-hidden="true"></span>
        <span class="dpad-bar dpad-bar-y" aria-hidden="true"></span>
        <span class="dpad-mark dpad-mark-up">▲</span>
        <span class="dpad-mark dpad-mark-left">◀</span>
        <span class="dpad-mark dpad-mark-right">▶</span>
        <span class="dpad-mark dpad-mark-down">▼<small>隠</small></span>
        <span class="dpad-nub" aria-hidden="true"></span>
      </div>
      <div class="action-buttons" aria-label="面ボタン">
        <button id="btn-throw" class="action-x game-btn" type="button" aria-label="手裏剣"><b>X</b><small>手裏剣</small></button>
        <button id="btn-dash" class="action-y game-btn" type="button" aria-label="影走り"><b>Y</b><small>影走</small></button>
        <button id="btn-slash" class="action-a game-btn" type="button" aria-label="斬撃"><b>A</b><small>斬</small></button>
        <button id="btn-jump" class="action-b game-btn" type="button" aria-label="跳躍"><b>B</b><small>跳</small></button>
      </div>
      <p class="keyboard-help">丸十字は斜め可　↓隠　↑/B跳　A斬　X手裏剣　Y影走　P停止</p>
    </section>
  </main>

  <audio id="stealthBgm" src="audio/kokoro-game.mp3" loop preload="auto" playsinline webkit-playsinline></audio>
  <audio id="battleBgm" src="audio/nekugi-game.mp3" loop preload="auto" playsinline webkit-playsinline></audio>
  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
