<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#080b0d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <meta property="og:title" content="影ノ城・忍殺行">
  <meta property="og:description" content="斬撃・手裏剣・隠れ身を駆使して城を駆け上がる忍者アクション">
  <meta property="og:url" content="https://titan11111.github.io/033-nekubi/">
  <meta property="og:type" content="website">
  <title>影ノ城・忍殺行</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="game-shell">
    <section id="action-panel" aria-label="アクション画面">
      <div id="overlay">
        <p class="seal">極秘</p>
        <h1 id="title">影ノ城</h1>
        <p id="mission">敵兵ヲ退ケ、最上階ノ敵将ヲ討テ</p>
        <button id="startBtn" type="button">忍務開始</button>
        <p class="start-guide">斬って忍力を溜め、火・水・雷の術を放て</p>
      </div>
      <canvas id="gameCanvas" width="800" height="600"></canvas>
      <div id="hud">
        <span id="stageLabel">壱ノ階</span>
        <span id="lifeLabel">命 ●●●</span>
        <span id="weaponLabel">手裏剣 × 06</span>
        <span id="jutsuLabel">忍力 火遁 000%</span>
        <button id="muteBtn" class="utility-btn" type="button" aria-label="音を消す">音</button>
      </div>
      <div id="unified-alert" role="status" aria-live="polite">
        <strong id="alert-title">忍務</strong>
        <span id="alert-text">敵を討ち、光る扉へ向かえ</span>
      </div>
      <div id="combo" aria-hidden="true"></div>
    </section>

    <section id="control-panel" aria-label="スーパーファミコン型操作盤">
      <div class="controller-grip left-grip">
        <div id="dpad" aria-label="方向キー">
          <button id="btn-up" class="pad-btn up" type="button" aria-label="上・扉に入る">▲</button>
          <button id="btn-left" class="pad-btn left" type="button" aria-label="左へ移動">◀</button>
          <span class="pad-center"></span>
          <button id="btn-right" class="pad-btn right" type="button" aria-label="右へ移動">▶</button>
          <button id="btn-down" class="pad-btn down" type="button" aria-label="隠れ身">▼</button>
        </div>
      </div>

      <div id="center-controls">
        <button id="selectBtn" class="pill-btn" type="button">SELECT<small>忍術切替</small></button>
        <button id="startPauseBtn" class="pill-btn" type="button">START<small>停止</small></button>
      </div>

      <div class="controller-grip right-grip">
        <div id="actions" aria-label="アクションボタン">
          <button id="btn-x" class="action-btn x-btn" type="button"><b>X</b><small>手裏剣</small></button>
          <button id="btn-y" class="action-btn y-btn" type="button"><b>Y</b><small>忍術</small></button>
          <button id="btn-a" class="action-btn a-btn" type="button"><b>A</b><small>斬る</small></button>
          <button id="btn-b" class="action-btn b-btn" type="button"><b>B</b><small>跳ぶ</small></button>
        </div>
      </div>
    </section>
  </main>

  <svg class="svg-defs" aria-hidden="true">
    <defs>
      <filter id="ink-rough">
        <feTurbulence type="fractalNoise" baseFrequency=".025" numOctaves="2" seed="8" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="5"/>
      </filter>
      <symbol id="shuriken-mark" viewBox="-20 -20 40 40">
        <path d="M0-19 5-5 19 0 5 5 0 19-5 5-19 0-5-5Z" fill="currentColor"/>
        <circle r="3.5" fill="#15171b"/>
      </symbol>
    </defs>
  </svg>
  <script src="script.js"></script>
</body>
</html>
