<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>SHINOBI//CASTLE - HTML5 Action Mockup</title>
<style>
  :root{
    color-scheme:dark;
    --ink:#081017;--paper:#e9f0ef;--accent:#9fffea;--danger:#ff8c8c;
  }
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020509;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--paper)}
  #wrap{position:relative;width:100%;height:100%}
  canvas{display:block;width:100%;height:100%;touch-action:none;background:#03070c}
  #hud{position:absolute;inset:0;pointer-events:none}
  .top{display:flex;justify-content:space-between;gap:12px;padding:14px 16px;font-weight:800;letter-spacing:.08em;text-shadow:0 2px 12px #000}
  .panel{background:#071018aa;border:1px solid #d7ffff25;border-radius:14px;padding:9px 12px;backdrop-filter:blur(8px)}
  #tech{position:absolute;right:14px;bottom:14px;max-width:min(430px,80vw);font-size:11px;line-height:1.45;opacity:.78}
  #toast{position:absolute;left:50%;top:18%;transform:translateX(-50%);font-size:clamp(18px,4vw,46px);font-weight:900;letter-spacing:.14em;text-align:center;text-shadow:0 4px 24px #000;opacity:0}
  #help{position:absolute;left:14px;bottom:14px;font-size:12px;opacity:.82}
  #start{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#14302d 0,#05090d 42%,#010204 100%)}
  #startCard{width:min(760px,90vw);padding:30px;border-radius:24px;border:1px solid #d6ffff25;background:#071019cc;box-shadow:0 30px 100px #000}
  h1{margin:0 0 8px;font-size:clamp(34px,7vw,80px);line-height:.9;letter-spacing:-.04em}
  .sub{opacity:.72;margin-bottom:22px}
  button{pointer-events:auto;border:1px solid #bfffee55;background:#d8fff0;color:#06110f;border-radius:999px;padding:13px 22px;font-weight:900;font-size:16px;cursor:pointer}
  .tiny{font-size:12px;opacity:.62;margin-top:14px}
  @media(max-width:700px){#tech{display:none}.top{font-size:12px}#help{font-size:10px}}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720" aria-label="忍者アクションゲーム"></canvas>
  <div id="hud">
    <div class="top">
      <div class="panel" id="stageLabel">STAGE 1</div>
      <div class="panel" id="stats">影力 100 / 警戒 0%</div>
    </div>
    <div id="toast"></div>
    <div class="panel" id="help">A/D 移動 ・ W/Space 跳ぶ ・ J 斬撃 ・ Shift 影走り ・ E 殿に接触後クリア ・ F 全画面</div>
    <div class="panel" id="tech"></div>
  </div>
  <div id="start">
    <div id="startCard">
      <h1>SHINOBI//CASTLE</h1>
      <div class="sub">敵を倒すより、城を読む。5つの城郭を抜け、毎夜待つ殿へ到達せよ。</div>
      <button id="startBtn">潜入開始</button>
      <div class="tiny">WebGPU対応環境ではGPU初期化を試行。非対応時もCanvas 2Dでプレイできます。</div>
    </div>
  </div>
</div>
<script>
(()=>{
"use strict";

/* =========================================================
   SHINOBI//CASTLE - single-file HTML5 action mockup
   Modern Web features used:
   1 Canvas 2D  2 WebGPU capability/init  3 Web Worker
   4 OffscreenCanvas  5 Web Audio API  6 Gamepad API
   7 Pointer Events  8 Web Animations API  9 Fullscreen API
   10 Page Visibility API + localStorage progression
   ========================================================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d",{alpha:false});
const stageLabel = document.getElementById("stageLabel");
const stats = document.getElementById("stats");
const toast = document.getElementById("toast");
const techBox = document.getElementById("tech");
const start = document.getElementById("start");
const startBtn = document.getElementById("startBtn");

let W=1280,H=720,DPR=1;
function resize(){
  DPR=Math.min(2,devicePixelRatio||1);
  const r=canvas.getBoundingClientRect();
  canvas.width=Math.max(640,Math.floor(r.width*DPR));
  canvas.height=Math.max(360,Math.floor(r.height*DPR));
  W=canvas.width/DPR; H=canvas.height/DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener("resize",resize); resize();

const tech = {
  "Canvas 2D":true,
  "WebGPU":!!navigator.gpu,
  "Web Worker":!!window.Worker,
  "OffscreenCanvas":!!window.OffscreenCanvas,
  "Web Audio":!!window.AudioContext,
  "Gamepad":!!navigator.getGamepads,
  "Pointer Events":!!window.PointerEvent,
  "Web Animations":!!Element.prototype.animate,
  "Fullscreen":!!document.documentElement.requestFullscreen,
  "Page Visibility":("hidden" in document)
};
function renderTech(){
  techBox.innerHTML="<b>HTML5 / Web API</b><br>"+Object.entries(tech).map(([k,v])=>`${v?"●":"○"} ${k}`).join("　");
}
renderTech();

let gpuDevice=null;
async function initWebGPU(){
  if(!navigator.gpu) return;
  try{
    const adapter=await navigator.gpu.requestAdapter();
    if(adapter){ gpuDevice=await adapter.requestDevice(); tech.WebGPU=!!gpuDevice; renderTech(); }
  }catch(e){ tech.WebGPU=false; renderTech(); }
}

let audioCtx=null;
function initAudio(){
  if(!window.AudioContext) return;
  audioCtx ||= new AudioContext();
  if(audioCtx.state==="suspended") audioCtx.resume();
}
function blip(freq=220,dur=.08,type="sine",gain=.04){
  if(!audioCtx)return;
  const o=audioCtx.createOscillator(), g=audioCtx.createGain();
  o.type=type;o.frequency.value=freq;g.gain.value=gain;
  o.connect(g).connect(audioCtx.destination);
  const t=audioCtx.currentTime;
  g.gain.setValueAtTime(gain,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.start(t);o.stop(t+dur);
}

let worker=null, workerPulse=0;
if(window.Worker){
  const workerCode=`
    let t=0;
    onmessage=e=>{
      if(e.data==="pulse"){
        t+=0.07;
        const fog=Array.from({length:22},(_,i)=>({
          x:(Math.sin(t+i*3.17)*.5+.5),
          y:(Math.cos(t*.7+i*1.9)*.5+.5),
          a:.05+(i%5)*.012
        }));
        postMessage(fog);
      }
    };
    // Touch OffscreenCanvas when available so rendering work can migrate off-main-thread.
    if(typeof OffscreenCanvas!=="undefined"){
      const c=new OffscreenCanvas(8,8); const x=c.getContext("2d");
      x.fillRect(0,0,1,1);
    }`;
  worker=new Worker(URL.createObjectURL(new Blob([workerCode],{type:"text/javascript"})));
  worker.onmessage=e=>workerFog=e.data;
}
let workerFog=[];

const keys=new Set();
addEventListener("keydown",e=>{
  keys.add(e.code);
  if(["Space","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.code))e.preventDefault();
  if(e.code==="KeyF") toggleFullscreen();
});
addEventListener("keyup",e=>keys.delete(e.code));
canvas.addEventListener("pointerdown",()=>{initAudio();canvas.focus();});

function toggleFullscreen(){
  if(!document.fullscreenElement) document.documentElement.requestFullscreen?.();
  else document.exitFullscreen?.();
}
document.addEventListener("visibilitychange",()=>{paused=document.hidden;});

const STAGES=[
  {
    name:"壱ノ城・月下外郭",sky:["#07101a","#172533"],accent:"#9fffea",
    subtitle:"壁は道。高低差で見張りの視界を外せ。",
    platforms:[[0,.88,1,.12],[.12,.69,.18,.035],[.38,.57,.17,.035],[.64,.72,.14,.035],[.83,.52,.15,.035]],
    guards:[[.30,.84,90],[.58,.53,100],[.78,.68,80]],lord:[.94,.47]
  },
  {
    name:"弐ノ城・雨の屋根",sky:["#08111b","#102b3b"],accent:"#91d5ff",
    subtitle:"雨音が足音を隠す。止まるより流れろ。",
    platforms:[[0,.89,1,.11],[.08,.73,.16,.03],[.29,.62,.12,.03],[.47,.48,.16,.03],[.69,.64,.12,.03],[.84,.42,.14,.03]],
    guards:[[.22,.85,100],[.41,.58,80],[.76,.60,90]],lord:[.93,.37]
  },
  {
    name:"参ノ城・水鏡庭園",sky:["#05100e","#12342e"],accent:"#b6ffbb",
    subtitle:"水面は鏡。姿が映る場所では警戒が上がる。",
    platforms:[[0,.88,1,.12],[.05,.66,.18,.035],[.30,.77,.13,.035],[.49,.59,.17,.035],[.71,.74,.10,.035],[.84,.53,.15,.035]],
    guards:[[.26,.84,100],[.45,.73,80],[.68,.55,100],[.81,.70,70]],lord:[.94,.48]
  },
  {
    name:"四ノ城・障子迷宮",sky:["#110b12","#2a1722"],accent:"#ffc2e6",
    subtitle:"開く道と閉じる道。時間で地形が呼吸する。",
    platforms:[[0,.89,1,.11],[.10,.72,.15,.035],[.31,.54,.14,.035],[.50,.72,.16,.035],[.71,.50,.12,.035],[.85,.68,.14,.035]],
    guards:[[.28,.85,100],[.45,.50,90],[.67,.68,80],[.84,.46,90]],lord:[.94,.63]
  },
  {
    name:"伍ノ城・天守",sky:["#050506","#271510"],accent:"#ffd27d",
    subtitle:"最後は速さではない。灯りが消える瞬間を読め。",
    platforms:[[0,.89,1,.11],[.09,.70,.14,.035],[.28,.52,.15,.035],[.47,.68,.13,.035],[.64,.47,.14,.035],[.82,.62,.17,.035]],
    guards:[[.24,.85,110],[.44,.48,85],[.61,.64,100],[.80,.43,100]],lord:[.94,.57]
  }
];

let stageIndex=0, paused=false, running=false, last=performance.now(), camX=0;
let alert=0, shadow=100, stageTime=0, clearReady=false;

const player={x:80,y:100,w:28,h:42,vx:0,vy:0,onGround:false,face:1,dash:0,trail:[],attack:0};
let guards=[];

function worldW(){return Math.max(W*1.85,1500)}
function resetStage(){
  const s=STAGES[stageIndex], ww=worldW();
  stageTime=0;alert=0;shadow=100;clearReady=false;camX=0;
  player.x=60; player.y=H*.76; player.vx=player.vy=0; player.trail=[]; player.attack=0;
  guards=s.guards.map(([x,y,r],i)=>({x:x*ww,y:y*H,w:30,h:38,dir:i%2?1:-1,base:x*ww,range:r,phase:i*.7,disabled:false,disabledTimer:0}));
  stageLabel.textContent=`STAGE ${stageIndex+1}/5 — ${s.name}`;
  showToast(s.name+"<br><small>"+s.subtitle+"</small>",1200);
}
function showToast(html,dur=900){
  toast.innerHTML=html; toast.style.opacity=1;
  toast.animate?.([{transform:"translateX(-50%) scale(.94)",opacity:0},{transform:"translateX(-50%) scale(1)",opacity:1}],{duration:260,easing:"ease-out"});
  clearTimeout(showToast.t); showToast.t=setTimeout(()=>toast.style.opacity=0,dur);
}
function rects(){
  const s=STAGES[stageIndex],ww=worldW();
  return s.platforms.map(([x,y,w,h])=>({x:x*ww,y:y*H,w:w*ww,h:h*H}));
}
function overlap(a,b){return a.x<a.x+a.w && b.x<b.x+b.w && a.x+a.w>b.x && a.y+a.h>b.y && a.y<b.y+b.h}

function update(dt){
  if(!running||paused)return;
  stageTime+=dt;
  const ww=worldW();
  const left=keys.has("KeyA")||keys.has("ArrowLeft");
  const right=keys.has("KeyD")||keys.has("ArrowRight");
  const jump=keys.has("KeyW")||keys.has("ArrowUp")||keys.has("Space");
  const dashKey=keys.has("ShiftLeft")||keys.has("ShiftRight");
  let axis=(right?1:0)-(left?1:0);

  // Gamepad API
  const gp=navigator.getGamepads?.()[0];
  if(gp){
    if(Math.abs(gp.axes[0])>.2) axis=gp.axes[0];
    if(gp.buttons[0]?.pressed) keys.add("GamepadJump"); else keys.delete("GamepadJump");
  }

  player.vx += axis*1300*dt;
  player.vx *= Math.pow(.0006,dt);
  if(axis) player.face=Math.sign(axis);

  if((jump||keys.has("GamepadJump")) && player.onGround){
    player.vy=-650; player.onGround=false; blip(330,.07,"triangle",.025);
  }
  if(dashKey && shadow>0 && player.dash<=0){
    player.dash=.13; shadow=Math.max(0,shadow-24); player.vx=player.face*760; blip(110,.1,"sawtooth",.022);
  }
  player.dash=Math.max(0,player.dash-dt);

  // Sword attack: J key. Short-range non-graphic slash that disables guards.
  if(keys.has("KeyJ") && player.attack<=0){
    player.attack=.18;
    blip(620,.06,"square",.025);
  }
  player.attack=Math.max(0,player.attack-dt);

  if(player.attack>0){
    const reach=62;
    for(const g of guards){
      const dx=g.x-(player.x+player.w/2);
      const dy=Math.abs((g.y+g.h/2)-(player.y+player.h/2));
      const inFront=(player.face>0 ? dx>=0 : dx<=0);
      if(inFront && Math.abs(dx)<reach && dy<46){
        g.disabled=true;
        g.disabledTimer=2.2;
        alert=Math.max(0,alert-18);
      }
    }
  }

  shadow=Math.min(100,shadow+10*dt);

  player.vy+=1250*dt;
  player.x+=player.vx*dt;
  let oldY=player.y; player.y+=player.vy*dt;
  player.onGround=false;

  for(const p of rects()){
    if(player.x+player.w>p.x && player.x<p.x+p.w){
      if(oldY+player.h<=p.y && player.y+player.h>=p.y && player.vy>=0){
        player.y=p.y-player.h;player.vy=0;player.onGround=true;
      }
    }
  }
  if(player.y>H+120){player.x=Math.max(30,player.x-180);player.y=40;player.vy=0;alert=Math.min(100,alert+12)}
  player.x=Math.max(0,Math.min(ww-player.w,player.x));

  if(player.dash>0){
    player.trail.push({x:player.x,y:player.y,a:.65});
    if(player.trail.length>12)player.trail.shift();
  }
  player.trail.forEach(t=>t.a*=.9);

  // Guards + abstract vision cones
  let seen=false;
  for(const g of guards){
    if(g.disabled){
      g.disabledTimer-=dt;
      if(g.disabledTimer<=0) g.disabled=false;
      continue;
    }
    g.x=g.base+Math.sin(stageTime*.9+g.phase)*g.range;
    g.dir=Math.cos(stageTime*.9+g.phase)>=0?1:-1;
    const dx=(player.x-g.x)*g.dir, dy=Math.abs((player.y+20)-(g.y+18));
    if(dx>0&&dx<190&&dy<95&&player.dash<=0) seen=true;
  }
  alert=Math.max(0,Math.min(100,alert+(seen?46:-18)*dt));

  // Lord reach
  const lord={x:STAGES[stageIndex].lord[0]*ww-22,y:STAGES[stageIndex].lord[1]*H-50,w:44,h:60};
  const near=Math.abs((player.x+player.w/2)-(lord.x+lord.w/2))<60 && Math.abs(player.y-lord.y)<90;
  clearReady=near;
  if(near && keys.has("KeyE")){
    completeStage();
  }

  camX+=(Math.max(0,Math.min(ww-W,player.x-W*.38))-camX)*Math.min(1,dt*5.5);
  stats.textContent=`影力 ${Math.round(shadow)} / 警戒 ${Math.round(alert)}%${clearReady?" / E：任務完了":""}`;

  workerPulse+=dt;
  if(worker&&workerPulse>.12){workerPulse=0;worker.postMessage("pulse")}
}
function completeStage(){
  keys.delete("KeyE"); running=false; blip(520,.1,"triangle",.04);setTimeout(()=>blip(780,.18,"sine",.035),80);
  // Non-graphic abstract "mission complete" silhouette.
  ctx.save();ctx.fillStyle="#000";ctx.fillRect(0,0,W,H);ctx.restore();
  showToast("MISSION COMPLETE",900);
  localStorage.setItem("shinobi-stage",String(Math.max(stageIndex+1,+(localStorage.getItem("shinobi-stage")||0))));
  setTimeout(()=>{
    if(stageIndex<4){stageIndex++;resetStage();running=true;}
    else{
      showToast("五城攻略完了<br><small>影は歴史に名を残さない。</small>",2200);
      setTimeout(()=>{stageIndex=0;resetStage();running=true;},2400);
    }
  },1050);
}

function rounded(x,y,w,h,r){
  ctx.beginPath();ctx.roundRect(x,y,w,h,r);
}
function draw(){
  const s=STAGES[stageIndex],ww=worldW();
  const grad=ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,s.sky[0]);grad.addColorStop(1,s.sky[1]);
  ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);

  // Moon
  ctx.globalAlpha=.18;ctx.fillStyle=s.accent;ctx.beginPath();ctx.arc(W*.78-camX*.06,H*.18,70,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;

  // Worker-generated fog
  for(const f of workerFog){
    ctx.globalAlpha=f.a;ctx.fillStyle=s.accent;
    ctx.beginPath();ctx.ellipse(f.x*W,(.55+f.y*.35)*H,160,28,0,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;

  ctx.save();ctx.translate(-camX,0);

  // Distant castle silhouettes
  ctx.fillStyle="#0006";
  for(let x=0;x<ww;x+=260){
    const hh=100+((x/260)%3)*45;
    ctx.fillRect(x,H*.88-hh,210,hh);
    ctx.fillRect(x+25,H*.88-hh-34,160,34);
  }

  // Platforms
  for(const p of rects()){
    ctx.fillStyle="#101820";rounded(p.x,p.y,p.w,p.h,7);ctx.fill();
    ctx.fillStyle=s.accent;ctx.globalAlpha=.18;ctx.fillRect(p.x,p.y,p.w,2);ctx.globalAlpha=1;
  }

  // Dynamic shoji gates stage 4
  if(stageIndex===3){
    for(let i=0;i<4;i++){
      const gx=(.22+i*.18)*ww, open=(Math.sin(stageTime*1.2+i)>0);
      if(!open){
        ctx.fillStyle="#f1d7c922";ctx.fillRect(gx,H*.38,18,H*.5);
        ctx.strokeStyle=s.accent;ctx.globalAlpha=.35;ctx.strokeRect(gx,H*.38,18,H*.5);ctx.globalAlpha=1;
      }
    }
  }

  // Guard vision + guard
  for(const g of guards){
    ctx.save();ctx.translate(g.x,g.y);
    if(!g.disabled){
      ctx.fillStyle=alert>60?"#ff9b9b22":"#fff3";
      ctx.beginPath();ctx.moveTo(14,18);ctx.lineTo(14+g.dir*190,-65);ctx.lineTo(14+g.dir*190,100);ctx.closePath();ctx.fill();
    }
    ctx.fillStyle=g.disabled?"#34424a":"#7c8a92";rounded(0,0,g.w,g.h,8);ctx.fill();
    ctx.fillStyle="#d8fffa";ctx.globalAlpha=g.disabled?.18:.65;ctx.fillRect(g.dir>0?21:6,10,3,3);ctx.globalAlpha=1;
    ctx.restore();
  }

  // Lord
  const lx=s.lord[0]*ww, ly=s.lord[1]*H;
  ctx.save();ctx.translate(lx,ly);
  ctx.fillStyle="#f4c26d";ctx.globalAlpha=.18;ctx.beginPath();ctx.arc(0,0,58,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
  ctx.fillStyle="#d4ad63";ctx.fillRect(-21,-46,42,56);
  ctx.fillStyle="#ead7a5";ctx.fillRect(-13,-58,26,18);
  ctx.fillStyle="#c83";ctx.fillRect(-28,-66,56,7);
  ctx.fillStyle="#fff";ctx.font="700 12px system-ui";ctx.textAlign="center";ctx.fillText("殿",0,30);
  ctx.restore();

  // Player trail
  for(const t of player.trail){
    ctx.globalAlpha=t.a;ctx.fillStyle=s.accent;rounded(t.x,t.y,player.w,player.h,8);ctx.fill();
  }
  ctx.globalAlpha=1;

  // Ninja (abstract)
  ctx.save();ctx.translate(player.x,player.y);
  ctx.fillStyle="#06090d";rounded(0,0,player.w,player.h,9);ctx.fill();
  ctx.fillStyle=s.accent;ctx.globalAlpha=.85;ctx.fillRect(player.face>0?18:7,10,4,3);ctx.globalAlpha=1;
  ctx.strokeStyle=s.accent;ctx.globalAlpha=.35;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(5,29);ctx.lineTo(-9*player.face,42);ctx.stroke();ctx.globalAlpha=1;

  if(player.attack>0){
    ctx.strokeStyle=s.accent;
    ctx.globalAlpha=Math.min(1,player.attack*6);
    ctx.lineWidth=5;
    ctx.beginPath();
    const cx=player.face>0?18:10;
    const startA=player.face>0?-1.0:Math.PI-2.1;
    const endA=player.face>0?1.0:Math.PI+2.1;
    ctx.arc(cx,22,46,startA,endA);
    ctx.stroke();
    ctx.globalAlpha=1;
  }
  ctx.restore();

  ctx.restore();

  // alert vignette
  if(alert>35){
    const a=(alert-35)/65*.28;
    const vg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.18,W/2,H/2,Math.max(W,H)*.65);
    vg.addColorStop(0,"transparent");vg.addColorStop(1,`rgba(255,80,80,${a})`);
    ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
  }
  // Scanlines
  ctx.globalAlpha=.035;ctx.fillStyle="#fff";
  for(let y=0;y<H;y+=4)ctx.fillRect(0,y,W,1);
  ctx.globalAlpha=1;
}
function loop(t){
  const dt=Math.min(.033,(t-last)/1000);last=t;
  update(dt);draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

startBtn.addEventListener("click",async()=>{
  initAudio(); await initWebGPU();
  start.animate?.([{opacity:1},{opacity:0}],{duration:450,easing:"ease-in",fill:"forwards"});
  setTimeout(()=>start.style.display="none",450);
  resetStage();running=true;
});
})();
</script>
</body>
</html>
